services:
  # one-shot: chown ./data and ./jobs to uid 33 so the tool runs non-root, then exits
  pa-automation-init:
    image: pa-automation:latest
    build: .
    user: '0'
    entrypoint: ['sh', '-c', 'chown -R 33:33 /data /jobs && chmod 700 /data /jobs']
    restart: 'no'
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ./data:/data
      - ${PA_JOBS_DIR:-./jobs}:/jobs

  pa-automation:
    image: pa-automation:latest
    container_name: pa-automation
    restart: unless-stopped
    depends_on:
      pa-automation-init:
        condition: service_completed_successfully
    user: '33:33'                     # www-data, never root
    ports:
      - '9198:8443'                   # change 9198 if already in use
    # empty = default; an invalid value stops the container, see its log
    environment:
      APP_DEBUG: '0'                  # 1 = Django debug page
      APP_ALLOWED_HOSTS: '*'          # comma separated host names / IPs
      APP_TZ_OFFSET_HOURS: '7'        # job time display, GMT+7
      APP_CERT_CN: 'pa-automation'    # self-signed cert CN
      APP_LOGIN_FAILURE_LIMIT: '5'    # failed logins before lock
      APP_LOGIN_COOLOFF_MINUTES: '15' # lock duration, minutes
      APP_HSTS_SECONDS: '0'           # 0 = off, only with a trusted cert
      APP_PANOS_CA_BUNDLE: ''         # firewall CA bundle path, empty = no verify
      APP_MIN_FREE_DISK_MB: '100'     # refuse new jobs below this free space
      APP_JOB_MAX_SIZE_MB: '1024'     # prune oldest jobs above this, 0 = no limit
    security_opt:
      - no-new-privileges:true        # no setuid privilege gain
    # no capabilities; no ping / tcpdump, they need NET_RAW
    cap_drop: [ALL]
    # deliberately not used: privileged, docker.sock, host network/pid/ipc, unconfined seccomp/apparmor
    # read-only rootfs, only volumes and tmpfs writable
    read_only: true
    tmpfs:
      - /run:size=16m,uid=33,gid=33,mode=0755
      - /tmp:size=64m,mode=1777
      - /var/log/apache2:size=16m,uid=33,gid=33,mode=0755
    # audit log lives here, forward to syslog/SIEM for long retention
    logging:
      driver: json-file
      options:
        max-size: '100m'                   # 10 x 100 MB, about 1 GB
        max-file: '10'
    volumes:
      - ./data:/var/www/html/data
      # larger disk: set PA_JOBS_DIR in a .env file next to this file
      - ${PA_JOBS_DIR:-./jobs}:/var/www/html/jobs
