WSGIPythonPath /var/www/html/django_app

#mandatory
# 1 process (job lock + job state are in memory of this process), umask 077 -> job files / DB readable by www-data only
# lang / locale: UTF-8 for the Python of the tool (Apache runs with LANG=C -> ASCII; BUG-52)
# processes=1 is REQUIRED: 1 job at a time (run_lock) and running jobs (active_jobs) are kept in the memory of this single process
WSGIDaemonProcess django_app processes=1 threads=15 umask=0077 display-name=pa-automation python-home=/opt/venv python-path=/var/www/html lang='C.UTF-8' locale='C.UTF-8'
# main interpreter: numpy / pandas (C extensions) are not made for Python sub-interpreters
WSGIApplicationGroup %{GLOBAL}

# TLS: only TLS 1.2 / 1.3, strong ciphers (Mozilla "intermediate"), no compression, no session tickets
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
SSLHonorCipherOrder     off
SSLCompression          off
SSLSessionTickets       off

<VirtualHost *:8443>
        ServerName localhost
        DocumentRoot /var/www/html/django_app

        # logs to the container output (docker logs): Django / audit log -> stderr, access log -> stdout
        ErrorLog /dev/stderr
        # healthcheck requests from inside the container not logged
        SetEnvIf Remote_Addr "^127\.0\.0\.1$" nolog
        CustomLog /dev/stdout combined env=!nolog

        # request body max 20 MB (uploaded .xlsx max 10 MB, checked again by the application)
        LimitRequestBody 20971520

        # security headers of static files served by Apache (/static, /static/admin).
        # Pages from Django get their headers from Django (settings.py + security.py): NOT added here,
        # Apache "Header always" cannot see Django headers -> CSP would be sent twice and block the page styles
        <Location /static>
                Header always set X-Content-Type-Options "nosniff"
                Header always set X-Frame-Options "DENY"
                Header always set Referrer-Policy "same-origin"
                Header always set Cross-Origin-Opener-Policy "same-origin"
                Header always set Cross-Origin-Resource-Policy "same-origin"
                Header always set X-Permitted-Cross-Domain-Policies "none"
                Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
                Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        </Location>

        # django admin static (must be before /static alias)
        Alias /static/admin /opt/admin-static
        <Directory /opt/admin-static>
                Options -Indexes
                Require all granted
        </Directory>

        Alias /static /var/www/html/django_app/static
        <Directory /var/www/html/django_app/static>
                Options -Indexes
                Require all granted
        </Directory>

        #apache handler for django
        <Directory /var/www/html/django_app>
                <Files wsgi.py>
                        Require all granted
                </Files>
        </Directory>

        #mandatory :)))
        WSGIProcessGroup django_app
        WSGIScriptAlias / /var/www/html/django_app/wsgi.py

        #ssl cert
        SSLEngine on
        # generated per installation by entrypoint.sh, replace with your own certificate if needed
        SSLCertificateFile      /var/www/html/data/ssl/server.crt
        SSLCertificateKeyFile   /var/www/html/data/ssl/server.key

</VirtualHost>
